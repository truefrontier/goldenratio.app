<!DOCTYPE html>
<html lang="en" class="<%= NODE_ENV %>">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Golden Ratio — Design calculator, grid &amp; spacing tools</title>
    <meta name="description" content="Golden Ratio is a free web toolkit for designers: golden-ratio calculator, layout grid, and spacing helpers. Fast, simple, no account.">
    <link rel="canonical" href="https://goldenratio.app/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://goldenratio.app/">
    <meta property="og:title" content="Golden Ratio — Design calculator, grid &amp; spacing tools">
    <meta property="og:description" content="Free golden-ratio calculator plus grid and spacing tools for designers. No account.">
    <meta property="og:site_name" content="Golden Ratio">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Golden Ratio — Design calculator, grid &amp; spacing tools">
    <meta name="twitter:description" content="Free golden-ratio calculator plus grid and spacing tools for designers.">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#3684cc">
    <meta name="msapplication-TileColor" content="#2b5797">
    <meta name="theme-color" content="#ffffff">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fa.truefrontierapps.com/v5/css/all.min.css" />
    <!-- Fathom Analytics -->
    <script src="https://cdn.usefathom.com/script.js" data-site="ROVVPECQ" data-spa="auto" defer></script>
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "name": "Golden Ratio",
      "url": "https://goldenratio.app/",
      "description": "Design toolkit: golden-ratio calculator, grid, and spacing helpers."
    },
    {
      "@type": "SoftwareApplication",
      "name": "Golden Ratio",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Web",
      "url": "https://goldenratio.app/",
      "description": "Browser-based golden ratio calculator with grid and spacing tools for design work.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
  ]
}
</script>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app">
      <!-- Static copy of src/components/app/Header.vue so the server HTML has an <h1> and the
           header doesn't move when Vue mounts (mount replaces #app). Keep in sync with Header.vue.
           The brand is the <h1> only here; once mounted, each view renders its own single <h1>. -->
      <div class="Header">
        <div class="container mt-7">
          <div class="flex flex-wrap items-center justify-between">
            <div class="flex items-center cursor-pointer whitespace-no-wrap">
              <div class="flex mr-5">
                <div class="w-7 h-7 bg-blue-700 rounded overflow-hidden shadow-lg">
                  <div class="w-6 h-6 bg-blue-500 rounded-br">
                    <div class="w-5 h-5 bg-blue-400 rounded-br-sm"></div>
                  </div>
                </div>
              </div>
              <h1 class="text-blue-600 font-bold font-brand text-4xl leading-7">Golden Ratio</h1>
            </div>
            <div class="my-4 -ml-6"
              ><a href="#/spacing" class="py-2 ml-6 text-gray-800 hover:text-blue-500"> Spacing </a
              ><a href="#/grid" class="py-2 ml-6 text-gray-800 hover:text-blue-500"> Grid </a
              ><a href="#/calculator" class="py-2 ml-6 text-gray-800 hover:text-blue-500"> Calculator </a
              ><a
                href="https://github.com/truefrontier/tailwindcss-golden-ratio"
                target="_blank"
                rel="noopener"
                class="py-2 ml-6 text-gray-800 hover:text-blue-500"
                ><i class="fa fa-github fa-lg"></i> Github </a
            ></div>
          </div>
        </div>
      </div>
    </div>
    <!-- built files will be auto injected -->
  </body>
</html>
